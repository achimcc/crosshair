[package]
name = "crosshair"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
description = "Does this rule point at anything real? Puts every selector of an alerting rule or dashboard panel to the running instance"
repository = "https://github.com/achimcc/crosshair"
readme = "README.md"
keywords = ["prometheus", "loki", "grafana", "promql", "cli"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1"
lexopt = "0.3"
promql-parser = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_norway = "0.9.42"
toml = "0.9"

[profile.release]
lto = true
